<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qual é o procedimento ideal para as tuas sobrancelhas?</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap">
<style>
:root{--bg:#f7ecee;--card:#fffafa;--tx:#2a1626;--mut:#7d6573;--ac:#8f2a5b;--acx:#fff;--bd:#e7cfd6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1219;--card:#2a1b26;--tx:#f6e8ee;--mut:#bba2b1;--ac:#e08bb2;--acx:#1d1219;--bd:#46303f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1219;--card:#2a1b26;--tx:#f6e8ee;--mut:#bba2b1;--ac:#e08bb2;--acx:#1d1219;--bd:#46303f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 "DM Sans",system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:28px 20px 48px}
h1{font:400 clamp(2rem,9vw,2.8rem)/1.08 "DM Serif Display",Georgia,serif;margin:0 0 10px}
.sub{color:var(--mut);margin:0 0 28px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px}
h2{font:400 1.5rem/1.2 "DM Serif Display",Georgia,serif;margin:0 0 16px}
.prog{color:var(--mut);font-size:.9rem;margin:0 0 8px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:0 0 10px}
.opt:hover,.opt:focus-visible{border-color:var(--ac);outline:none}
.go{background:var(--ac);color:var(--acx);border:0;border-radius:999px;padding:13px 24px;font-weight:500}
.alt{background:transparent;border:0;color:var(--mut);text-decoration:underline;padding:12px 0 0}
.res-t{font:400 2rem/1.1 "DM Serif Display",Georgia,serif;color:var(--ac);margin:0 0 12px}
.cta{margin-top:18px;padding-top:16px;border-top:1px solid var(--bd);color:var(--mut)}
.snd{display:inline-block;text-decoration:none;margin-top:16px}
.msg{color:var(--mut);font-size:.9rem;margin:12px 0 0}
.snd2{display:block;width:fit-content}
.hint{margin:14px 0 0;font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>Qual é o procedimento ideal para as tuas sobrancelhas?</h1>
<p class="sub">Tu não és feia, só tens as sobrancelhas por fazer. Responde a 5 perguntas e descobre o serviço ideal para ti.</p>
<div class="card" id="box"></div>
</main>
<script>
var Q=[
{q:"Como estão as tuas sobrancelhas hoje?",o:[["Têm pelo, mas sem forma definida","d"],["Pelos rebeldes, cada um para seu lado","l"],["Com falhas e pouco preenchimento","m"],["Muito finas ou quase sem pelo","r"]]},
{q:"O que mais te incomoda?",o:[["Não terem um desenho limpo","d"],["Falta de volume e de direção","l"],["Precisar de maquilhagem todos os dias","m"],["Falhas onde o pelo já não nasce","r"]]},
{q:"Quanto tempo queres gastar com elas de manhã?",o:[["Pouco, só pentear","d"],["Quase nada, mas quero um efeito penteado","l"],["Nenhum","m"],["Aceito uma rotina se ajudar","r"]]},
{q:"Que resultado imaginas?",o:[["Natural e bem desenhado","d"],["Cheio e penteado para cima","l"],["Definido e duradouro","m"],["Recuperar o que perdi, aos poucos","r"]]},
{q:"Alguma vez tiveste sobrancelhas mais cheias?",o:[["Sim, já tive mais pelo","y"],["Não, nunca tive muito pelo","n"]]}
];
var R={
d:{t:"Design com linha",x:"A linha remove os pelos a mais com precisão e desenha uma forma limpa que valoriza o teu olhar, mantendo o aspeto natural."},
l:{t:"Brow lamination",x:"A brow lamination alinha e fixa os pelos na direção certa, dando volume e um efeito penteado que dura semanas."},
m:{t:"Microblading ou micropigmentação",x:"São duas técnicas com efeitos diferentes. No microblading são desenhados fios, para um efeito natural. Na micropigmentação usamos a técnica shadow, com efeito sombra. Nem sempre é possível aplicar uma ou outra, por isso a escolha é feita numa avaliação comigo."},
r:{t:"Brow Revival",x:"O Brow Revival é o meu método exclusivo para quem já teve sobrancelhas mais cheias. A tua sobrancelha renasce."}
};
var i=0,had=null,sc={d:0,l:0,m:0,r:0},box=document.getElementById("box");
function ask(){
 var q=Q[i];
 box.innerHTML='<p class="prog">Pergunta '+(i+1)+' de '+Q.length+'</p><h2></h2><div id="os"></div>';
 box.querySelector("h2").textContent=q.q;
 var os=document.getElementById("os");
 q.o.forEach(function(o){
  var b=document.createElement("button");b.className="opt";b.textContent=o[0];
  b.onclick=function(){if(o[1]==="y"||o[1]==="n"){had=o[1]==="y"}else{sc[o[1]]++}i++;i<Q.length?ask():show()};
  os.appendChild(b);
 });
}
function show(){
 var k="d";for(var x in sc){if(sc[x]>sc[k])k=x}
 if(k==="r"&&had===false){k="m"}var r=R[k];
 box.innerHTML='<p class="prog">O teu resultado</p><p class="res-t"></p><p id="rx"></p><p class="cta">Queres falar sobre o teu resultado? Envia-me o teu resultado por mensagem.</p><p class="hint">Toca no botão “enviar por WhatsApp” para enviares a tua resposta. Depois, clica em “abrir”. Na nossa conversa, vai aparecer o teu resultado. Clica no botão “enviar”.</p><a class="go snd" id="wa" target="_blank" rel="noopener" href="#">Enviar por WhatsApp</a><a class="alt snd2" id="snd" target="_blank" rel="noopener" href="https://ig.me/m/barbaradecastro_beautylab">Enviar por Instagram</a><p class="msg" id="msg"></p><button class="alt" id="again">Refazer o quiz</button>';
 box.querySelector(".res-t").textContent=r.t;
 document.getElementById("rx").textContent=r.x;
 var m="Olá Bárbara ✨ o resultado do meu quiz foi: "+r.t+".";
 document.getElementById("wa").href="https://wa.me/351918520906?text="+encodeURIComponent(m);
 document.getElementById("msg").textContent="No Instagram, ao tocar a mensagem é copiada. Cola-a no direct: "+m;
 document.getElementById("snd").onclick=function(){try{navigator.clipboard.writeText(m)}catch(e){}};
 document.getElementById("again").onclick=function(){i=0;had=null;sc={d:0,l:0,m:0,r:0};ask()};
}
ask();
</script>
</body>
</html>
